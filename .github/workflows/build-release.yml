# This is the workflow used for the public release repository (https://github.com/rrmassey/PromptPilot-releases). 

name: Build and Release
on:
  repository_dispatch:
    types: [build_release]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Bump versions in private repo config files ─────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.extract.outputs.version }}
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rrmassey/PromptPilot_v2.5
          token: ${{ secrets.SOURCE_REPO_PAT }}
          ref: main

      - name: Extract version from tag
        id: extract
        run: |
          TAG=${{ github.event.client_payload.tag }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Bump Cargo.toml
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ steps.extract.outputs.version }}\"/" desktop/src-tauri/Cargo.toml

      - name: Bump tauri.conf.json
        run: |
          jq --arg v "${{ steps.extract.outputs.version }}" '.version = $v' desktop/src-tauri/tauri.conf.json > tmp.json && mv tmp.json desktop/src-tauri/tauri.conf.json

      - name: Bump package.json
        run: |
          jq --arg v "${{ steps.extract.outputs.version }}" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Bump src/config.ts download URLs
        run: |
          V=${{ steps.extract.outputs.version }}
          sed -i "s/VERSION: '[^']*'/VERSION: '$V'/" src/config.ts
          sed -i "s|releases/download/v[^/]*/PromptPilot_[^']*_aarch64\.dmg|releases/download/v$V/PromptPilot_${V}_aarch64.dmg|g" src/config.ts
          sed -i "s|releases/download/v[^/]*/PromptPilot_[^']*_x64\.dmg|releases/download/v$V/PromptPilot_${V}_x64.dmg|g" src/config.ts
          sed -i "s|releases/download/v[^/]*/PromptPilot_[^']*_x64-setup\.exe|releases/download/v$V/PromptPilot_${V}_x64-setup.exe|g" src/config.ts

      - name: Commit version bumps back to private repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SOURCE_REPO_PAT }}@github.com/rrmassey/PromptPilot_v2.5.git
          git add desktop/src-tauri/Cargo.toml desktop/src-tauri/tauri.conf.json package.json src/config.ts
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.extract.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -e

          # Create release only if it doesn't already exist (idempotent for re-runs)
          if ! gh release view "$TAG" --repo rrmassey/PromptPilot-releases >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo rrmassey/PromptPilot-releases \
              --title "PromptPilot $TAG" \
              --notes "See the assets to download this version and install."
          fi

          # Fetch numeric release ID via gh api (no --repo flag; path is fully qualified)
          RELEASE_ID=$(gh api /repos/rrmassey/PromptPilot-releases/releases/tags/"$TAG" --jq '.id')

          echo "Using release id: $RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  # ── Job 2: Build matrix across all platforms ─────────────────────────────
  release:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
          - platform: macos-15-intel
            rust-target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout private source (with bumped versions)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rrmassey/PromptPilot_v2.5
          token: ${{ secrets.SOURCE_REPO_PAT }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Validate Python supply-chain policy
        run: node scripts/security/validate-python-supply-chain.mjs

      - name: Provision bundled Python runtime (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          PY_RUNTIME_SHA_WINDOWS: ${{ secrets.PY_RUNTIME_SHA_WINDOWS }}
        run: |
          $ErrorActionPreference = "Stop"
          $manifestPath = "desktop/src-tauri/python/runtime-manifest.json"
          $manifest = Get-Content -Path $manifestPath -Raw | ConvertFrom-Json
          $entry = $manifest.pythonBuildStandalone."windows-x86_64"
          if (-not $entry) { throw "Missing windows-x86_64 runtime entry in manifest." }
          $runtimeUrl = [string]$entry.url
          $runtimeSha = ([string]$entry.sha256).ToLowerInvariant()
          if ($runtimeSha.StartsWith("replace_")) {
            if ([string]::IsNullOrWhiteSpace($env:PY_RUNTIME_SHA_WINDOWS)) {
              throw "Missing PY_RUNTIME_SHA_WINDOWS secret for placeholder manifest SHA."
            }
            $runtimeSha = $env:PY_RUNTIME_SHA_WINDOWS.ToLowerInvariant()
          }
          $lockFile = [string]$manifest.pythonPackages.lockFile
          $host = ([uri]$runtimeUrl).Host
          if (-not ($manifest.allowedHosts -contains $host)) {
            throw "Runtime host '$host' is not allowlisted."
          }

          $archivePath = Join-Path $env:RUNNER_TEMP "python-runtime.tar.gz"
          Invoke-WebRequest -Uri $runtimeUrl -OutFile $archivePath
          $actualSha = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $runtimeSha) {
            throw "Python runtime checksum mismatch for Windows."
          }

          $stageDir = Join-Path $env:RUNNER_TEMP "python-runtime-stage"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          tar -xzf $archivePath -C $stageDir

          $pythonExe = Get-ChildItem -Path $stageDir -Recurse -File -Filter "python.exe" | Select-Object -First 1
          if (-not $pythonExe) { throw "Unable to locate python.exe in extracted runtime." }
          $runtimeRoot = $pythonExe.Directory.FullName
          if ($runtimeRoot -match '[\\/](bin|Scripts)$') {
            $runtimeRoot = Split-Path $runtimeRoot -Parent
          }

          $runtimeDest = Join-Path $PWD "desktop/src-tauri/resources/python-runtime"
          if (Test-Path $runtimeDest) {
            Remove-Item -Path $runtimeDest -Recurse -Force
          }
          New-Item -ItemType Directory -Path $runtimeDest -Force | Out-Null
          Copy-Item -Path (Join-Path $runtimeRoot "*") -Destination $runtimeDest -Recurse -Force

          & (Join-Path $runtimeDest "python.exe") -m pip install --upgrade pip
          & (Join-Path $runtimeDest "python.exe") -m pip install --no-cache-dir -r $lockFile
          & (Join-Path $runtimeDest "python.exe") -c "from liteparse import LiteParse; print('liteparse-ok')"

      - name: Provision bundled Python runtime (macOS)
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          PY_RUNTIME_SHA_MACOS_ARM64: ${{ secrets.PY_RUNTIME_SHA_MACOS_ARM64 }}
          PY_RUNTIME_SHA_MACOS_X64: ${{ secrets.PY_RUNTIME_SHA_MACOS_X64 }}
        run: |
          set -euo pipefail
          MANIFEST_PATH="desktop/src-tauri/python/runtime-manifest.json"
          LOCK_FILE=$(jq -r '.pythonPackages.lockFile' "$MANIFEST_PATH")
          case "${{ matrix.rust-target }}" in
            aarch64-apple-darwin)
              ENTRY_KEY="macos-aarch64"
              SHA_OVERRIDE="${PY_RUNTIME_SHA_MACOS_ARM64:-}"
              ;;
            x86_64-apple-darwin)
              ENTRY_KEY="macos-x86_64"
              SHA_OVERRIDE="${PY_RUNTIME_SHA_MACOS_X64:-}"
              ;;
            *)
              echo "Unsupported macOS target: ${{ matrix.rust-target }}"
              exit 1
              ;;
          esac

          RUNTIME_URL=$(jq -r --arg key "$ENTRY_KEY" '.pythonBuildStandalone[$key].url' "$MANIFEST_PATH")
          RUNTIME_SHA=$(jq -r --arg key "$ENTRY_KEY" '.pythonBuildStandalone[$key].sha256' "$MANIFEST_PATH")
          if [[ "${RUNTIME_SHA}" == REPLACE_* || "${RUNTIME_SHA}" == replace_* ]]; then
            if [ -z "${SHA_OVERRIDE}" ]; then
              echo "Missing SHA override secret for ${ENTRY_KEY} runtime."
              exit 1
            fi
            RUNTIME_SHA="${SHA_OVERRIDE}"
          fi
          HOST=$(echo "$RUNTIME_URL" | awk -F/ '{print $3}')
          if ! jq -e --arg host "$HOST" '.allowedHosts | index($host)' "$MANIFEST_PATH" >/dev/null; then
            echo "Runtime host '$HOST' is not allowlisted."
            exit 1
          fi

          ARCHIVE_PATH="$RUNNER_TEMP/python-runtime.tar.gz"
          curl -fsSL -o "$ARCHIVE_PATH" "$RUNTIME_URL"
          ACTUAL_SHA=$(shasum -a 256 "$ARCHIVE_PATH" | awk '{print $1}')
          if [ "${ACTUAL_SHA}" != "${RUNTIME_SHA}" ]; then
            echo "Python runtime checksum mismatch for ${ENTRY_KEY}."
            exit 1
          fi

          STAGE_DIR="$(mktemp -d)"
          export STAGE_DIR
          tar xzf "$ARCHIVE_PATH" -C "$STAGE_DIR"
          PYTHON_PATH=$(find "$STAGE_DIR" -type f -name "python3" -path "*/bin/*" | head -1)
          if [ -z "${PYTHON_PATH}" ]; then
            echo "Unable to locate python3 in extracted runtime."
            exit 1
          fi

          RUNTIME_DEST="desktop/src-tauri/resources/python-runtime"
          mkdir -p "$RUNTIME_DEST"
          ROOT_DIR="$(cd "$(dirname "$PYTHON_PATH")/.." && pwd)"
          cp -R "$ROOT_DIR"/. "$RUNTIME_DEST"/
          chmod +x "$RUNTIME_DEST/bin/python3"

          "$RUNTIME_DEST/bin/python3" -m pip install --upgrade pip
          "$RUNTIME_DEST/bin/python3" -m pip install --no-cache-dir -r "$LOCK_FILE"
          "$RUNTIME_DEST/bin/python3" -c "from liteparse import LiteParse; print('liteparse-ok')"

      # Latest ggml-org/llama.cpp prerelease: full Windows zips into cuda/vulkan/cpu (DLLs beside llama-server.exe)
      # Note: binaries are published as prereleases (bXXXX); /releases/latest returns non-prerelease v0.2.0 with no assets.
      - name: Download llama-server bundles (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Accept = "application/vnd.github+json"
            "User-Agent" = "PromptPilot-CI"
            Authorization = "Bearer $env:GITHUB_TOKEN"
          }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=20" -Headers $headers
          $release = $releases | Where-Object { $_.prerelease -eq $true } | Select-Object -First 1
          if (-not $release) { throw "No prerelease found for ggml-org/llama.cpp" }
          function Expand-LlamaBundle {
            param(
              [Parameter(Mandatory)] [string]$LikePattern,
              [Parameter(Mandatory)] [string]$DestRel
            )
            $asset = $release.assets | Where-Object { $_.name -like $LikePattern } | Select-Object -First 1
            if (-not $asset) {
              throw "No llama.cpp asset matching: $LikePattern"
            }
            $zipPath = Join-Path $env:RUNNER_TEMP $asset.name
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath -Headers $headers
            $dest = Join-Path $PWD $DestRel
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Expand-Archive -Path $zipPath -DestinationPath $dest -Force
            Remove-Item $zipPath -Force
          }
          $base = "desktop/src-tauri/resources/llama-server"
          Expand-LlamaBundle -LikePattern "llama-*-bin-win-cuda-12.4-x64.zip" -DestRel (Join-Path $base "cuda")
          Expand-LlamaBundle -LikePattern "llama-*-bin-win-vulkan-x64.zip" -DestRel (Join-Path $base "vulkan")
          Expand-LlamaBundle -LikePattern "llama-*-bin-win-cpu-x64.zip" -DestRel (Join-Path $base "cpu")

      # Latest ggml-org/llama.cpp prerelease: macOS tarball (Metal) includes dylibs next to llama-server
      # Note: binaries are published as prereleases (bXXXX); /releases/latest returns non-prerelease v0.2.0 with no assets.
      - name: Download llama-server bundle (macOS)
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REL_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "User-Agent: PromptPilot-CI" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=20" | jq '[.[] | select(.prerelease==true)][0]')
          if ! echo "$REL_JSON" | jq -e '.tag_name' >/dev/null 2>&1; then
            echo "Failed to fetch prerelease JSON for llama.cpp"
            exit 1
          fi
          case "${{ matrix.rust-target }}" in
            aarch64-apple-darwin)
              SUFFIX="bin-macos-arm64.tar.gz"
              ;;
            x86_64-apple-darwin)
              SUFFIX="bin-macos-x64.tar.gz"
              ;;
            *)
              echo "Unsupported macOS rust target: ${{ matrix.rust-target }}"
              exit 1
              ;;
          esac
          NAME=$(echo "$REL_JSON" | jq -r --arg sfx "$SUFFIX" '.assets[] | select(.name|endswith($sfx)) | .name' | head -1)
          if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
            echo "No asset ending with ${SUFFIX} in latest llama.cpp release"
            exit 1
          fi
          URL=$(echo "$REL_JSON" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .browser_download_url')
          WORK=$(mktemp -d)
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "User-Agent: PromptPilot-CI" \
            -o "$WORK/$NAME" \
            "$URL"
          tar xzf "$WORK/$NAME" -C "$WORK"
          ROOT=$(find "$WORK" -mindepth 1 -maxdepth 1 -type d -name 'llama-*' | head -1)
          if [ -z "$ROOT" ]; then
            echo "Could not find llama-* root directory in archive"
            exit 1
          fi
          DEST="desktop/src-tauri/resources/llama-server"
          mkdir -p "$DEST"
          cp -R "$ROOT"/* "$DEST/"
          chmod +x "$DEST/llama-server"

      - name: Verify bundled runtime files before publish
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            test -f desktop/src-tauri/resources/python-runtime/python.exe
          else
            test -f desktop/src-tauri/resources/python-runtime/bin/python3
          fi

      - name: Build and Release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PROMPTPILOT_PYTHON_BIN: ""
        with:
          projectPath: desktop/src-tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target ${{ matrix.rust-target }}
          includeUpdaterJson: true

  # ── Job 3: Rename latest.json → update.json, fix URLs, commit to private repo ─
  fix-update-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download latest.json from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          gh release download $TAG \
            --repo rrmassey/PromptPilot-releases \
            --pattern "latest.json" \
            --dir /tmp/release-assets

      - name: Fix URLs and rename to update.json
        run: |
          sed 's|rrmassey/PromptPilot_v2.5/releases/download|rrmassey/PromptPilot-releases/releases/download|g' \
            /tmp/release-assets/latest.json > /tmp/release-assets/update.json

      - name: Upload update.json and delete latest.json from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          gh release upload $TAG /tmp/release-assets/update.json \
            --repo rrmassey/PromptPilot-releases \
            --clobber
          gh release delete-asset $TAG latest.json \
            --repo rrmassey/PromptPilot-releases \
            --yes

      - name: Checkout private source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rrmassey/PromptPilot_v2.5
          token: ${{ secrets.SOURCE_REPO_PAT }}
          ref: main

      - name: Copy update.json to private repo and commit
        run: |
          cp /tmp/release-assets/update.json public/update.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SOURCE_REPO_PAT }}@github.com/rrmassey/PromptPilot_v2.5.git
          git add public/update.json
          git diff --staged --quiet || git commit -m "chore: update update.json for ${{ github.event.client_payload.tag }} [skip ci]"
          git push origin HEAD:main
